name: Sync Upstream (quattro & personal rebase)

# Sincroniza la rama quattro con omacom/omarchy:quattro (Fast-Forward)
# y rebasea la rama personal sobre quattro.

on:
  workflow_dispatch:
    inputs:
      force_push:
        description: "Hacer push a personal tras rebase exitoso"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configura git
        run: |
          git config --global user.name "omarchy-personal[bot]"
          git config --global user.email "omarchy-personal@users.noreply.github.com"

      - name: Fetch upstream quattro
        run: |
          git remote add upstream https://github.com/omacom/omarchy.git 2>/dev/null || true
          git fetch upstream quattro --tags

      - name: Fast-forward quattro
        run: |
          git checkout -B quattro upstream/quattro
          git push origin quattro

      - name: Rebase personal sobre quattro
        run: |
          git checkout personal
          if git rebase quattro; then
            echo "✓ Rebase exitoso y limpio."
            if [[ "${{ inputs.force_push }}" == "true" ]]; then
              git push --force-with-lease origin personal
            fi
          else
            echo "✗ CONFLICTO DETECTADO durante el rebase."
            CONFLICT_FILES="$(git diff --name-only --diff-filter=U 2>/dev/null || true)"
            git rebase --abort

            REPO="${{ github.repository }}"
            TITLE="[Conflicto Rebase] Sincronización manual de personal requiere intervención"
            BODY="Se detectó un conflicto de código al intentar rebasear la rama \`personal\` sobre \`quattro\`.\n\n### Archivos en conflicto:\n\`\`\`\n$CONFLICT_FILES\n\`\`\`\n\n### Cómo resolverlo manualmente:\n\`\`\`bash\ncd robert-flo_omarchy-personal\ngit fetch upstream\ngit checkout personal\ngit rebase upstream/quattro\n# Resuelve los conflictos en los archivos listados arriba\ngit add <archivos-resueltos>\ngit rebase --continue\ngit push --force-with-lease origin personal\n\`\`\`"

            gh issue create -R "$REPO" --title "$TITLE" --body "$BODY" || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
